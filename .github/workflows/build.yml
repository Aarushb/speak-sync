name: Build & Package SpeakSync

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows (Setup Installer & Portable ZIP)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install --python .venv/Scripts/python.exe -e ".[test]"
          uv pip install --python .venv/Scripts/python.exe pyinstaller

      - name: Run test suite
        run: |
          .venv/Scripts/pytest.exe -q

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Run Windows build pipeline
        run: |
          .venv/Scripts/python.exe scripts/build_windows.py

      - name: Upload Windows Portable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeakSync-Windows-Portable
          path: dist/*-windows-portable.zip
          if-no-files-found: error

      - name: Upload Windows Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeakSync-Windows-Installer
          path: dist/*-windows-setup.exe
          if-no-files-found: error

  build-macos:
    name: macOS (Standalone App Bundle)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install --python .venv/bin/python -e ".[test]"
          uv pip install --python .venv/bin/python pyinstaller

      - name: Run test suite
        run: |
          .venv/bin/pytest -q tests/test_models.py tests/test_classifier.py tests/test_folders.py tests/test_config.py tests/test_history.py tests/test_cross_platform_backends.py

      - name: Stamp build commit
        run: |
          echo "COMMIT = \"${GITHUB_SHA::7}\"" > src/speak_sync/buildinfo.py

      - name: Build macOS standalone application
        run: |
          .venv/bin/pyinstaller \
            --name "SpeakSync" \
            --windowed \
            --noconfirm \
            --clean \
            --add-data "assets:assets" \
            --hidden-import "soundobj" \
            --hidden-import "prism" \
            --hidden-import "prismatoid" \
            --hidden-import "AppKit" \
            --hidden-import "pynput" \
            --hidden-import "pynput.keyboard._darwin" \
            --hidden-import "pynput.mouse._darwin" \
            src/speak_sync/__main__.py

      - name: Configure macOS bundle metadata and sign bundle
        run: |
          plutil -replace LSUIElement -bool true dist/SpeakSync.app/Contents/Info.plist
          plutil -replace CFBundleName -string "SpeakSync" dist/SpeakSync.app/Contents/Info.plist
          plutil -replace CFBundleDisplayName -string "SpeakSync" dist/SpeakSync.app/Contents/Info.plist
          plutil -replace NSAppleEventsUsageDescription -string "SpeakSync monitors cloud sync status in the menu bar." dist/SpeakSync.app/Contents/Info.plist
          codesign --force --deep -s - dist/SpeakSync.app
          codesign --verify --deep --strict dist/SpeakSync.app

      - name: Smoke test that the app stays running with a status item
        run: |
          dist/SpeakSync.app/Contents/MacOS/SpeakSync &
          APP_PID=$!
          sleep 12
          kill -0 $APP_PID
          cat ~/Library/Logs/SpeakSync/speaksync.log
          grep -q "visible=True" ~/Library/Logs/SpeakSync/speaksync.log
          kill $APP_PID

      - name: Create macOS DMG installer and portable zip
        run: |
          cd dist
          zip -r -y SpeakSync-v0.1.0-macos-portable.zip SpeakSync.app
          cd ..
          hdiutil create -volname "SpeakSync" -srcfolder dist/SpeakSync.app -ov -format UDZO dist/SpeakSync-v0.1.0-macos-installer.dmg

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpeakSync-macOS-Bundle
          path: |
            dist/SpeakSync-*-macos-portable.zip
            dist/SpeakSync-*-macos-installer.dmg
          if-no-files-found: error

  build-linux:
    name: Linux (DEB Installer & Portable Tarball)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libnotify-dev \
            libsdl2-dev \
            libdbus-1-dev \
            libasound2-dev \
            libpulse-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install --python .venv/bin/python --only-binary wxpython --find-links https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04/ "wxpython<=4.2.5"
          uv pip install --python .venv/bin/python --only-binary wxpython --find-links https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04/ -e ".[test]"
          uv pip install --python .venv/bin/python pyinstaller

      - name: Run cross-platform test suite
        run: |
          .venv/bin/pytest -q tests/test_models.py tests/test_classifier.py tests/test_folders.py tests/test_config.py tests/test_history.py tests/test_cross_platform_backends.py

      - name: Build Linux standalone application
        run: |
          .venv/bin/pyinstaller \
            --name "speaksync" \
            --onedir \
            --noconfirm \
            --clean \
            --add-data "assets:assets" \
            --hidden-import "soundobj" \
            --hidden-import "prism" \
            --hidden-import "prismatoid" \
            --hidden-import "pynput" \
            --hidden-import "pynput.keyboard._xorg" \
            --hidden-import "pynput.mouse._xorg" \
            src/speak_sync/__main__.py

      - name: Create Linux release packages
        run: |
          cd dist
          tar -czvf SpeakSync-v0.1.0-linux-portable.tar.gz speaksync/
          cd ..
          mkdir -p deb-pkg/DEBIAN deb-pkg/opt/speaksync deb-pkg/usr/local/bin
          cp -r dist/speaksync/* deb-pkg/opt/speaksync/
          ln -s /opt/speaksync/speaksync deb-pkg/usr/local/bin/speaksync
          cat << 'EOF' > deb-pkg/DEBIAN/control
          Package: speaksync
          Version: 0.1.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Aarush Bhatnagar
          Description: Accessible cloud sync tray monitor with Prism screen reader speech and audio cues.
          EOF
          dpkg-deb --build deb-pkg dist/SpeakSync-v0.1.0-linux-installer.deb

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpeakSync-Linux-Bundle
          path: |
            dist/SpeakSync-*-linux-portable.tar.gz
            dist/SpeakSync-*-linux-installer.deb
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Display downloaded files
        run: ls -R release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/SpeakSync-Windows-Installer/*.exe
            release-artifacts/SpeakSync-Windows-Portable/*.zip
            release-artifacts/SpeakSync-macOS-Bundle/*.dmg
            release-artifacts/SpeakSync-macOS-Bundle/*.zip
            release-artifacts/SpeakSync-Linux-Bundle/*.deb
            release-artifacts/SpeakSync-Linux-Bundle/*.tar.gz
          generate_release_notes: true
